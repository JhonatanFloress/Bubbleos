<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PAPEL OS — escritorio experimental</title>
    <meta
      name="description"
      content="Un pequeño sistema operativo web de papel, ventanas y posibilidades."
    />
    <link rel="stylesheet" href="styles/base/reset-and-desktop.css" />
    <link rel="stylesheet" href="styles/shell/windows-classic.css" />
    <link rel="stylesheet" href="styles/apps/utilities.css" />
    <link rel="stylesheet" href="styles/shell/icons.css" />
    <link rel="stylesheet" href="styles/shell/glass-and-motion.css" />
    <link rel="stylesheet" href="styles/shell/desktop-composition.css" />
    <link rel="stylesheet" href="styles/shell/icon-layout.css" />
    <link rel="stylesheet" href="styles/apps/terminal-and-tools.css" />
    <link rel="stylesheet" href="styles/apps/gallery.css" />
    <link rel="stylesheet" href="styles/shell/controls.css" />
    <link rel="stylesheet" href="styles/shell/system-tray.css" />
    <link rel="stylesheet" href="styles/shell/window-manager.css" />
    <link rel="stylesheet" href="styles/shell/start-menu.css" />
    <link rel="stylesheet" href="styles/apps/explorer.css" />
    <link rel="stylesheet" href="styles/apps/music-player.css" />
    <link rel="stylesheet" href="styles/shell/aero-details.css" />
    <link rel="stylesheet" href="styles/apps/reminders.css" />
  </head>

  <body>
    <div id="boot">
      <div>PAPEL®<small>PERSONAL OPERATING SPACE</small></div>
      <p id="bootline">Preparando tu escritorio...</p>
      <span class="loader"></span>
    </div>
    <div id="desktop">
      <header>
        <button id="brand">▧ PAPEL OS <span>▼</span></button>
        <nav>
          <button data-open="files">Archivo</button><button data-open="settings">Escritorio</button
          ><button id="cascade">Ordenar ventanas</button>
        </nav>
        <div class="status"><span class="online"></span> TODO EN SU LUGAR <time></time></div>
      </header>
      <aside id="icons"></aside>
      <div class="wallpaper" aria-hidden="true">
        <div class="orbit o1"></div>
        <div class="orbit o2"></div>
        <div class="orbit o3"></div>
        <span class="wall-name">papel<span>®</span></span>
        <div class="wall-sub">UN ESPACIO PARA HACER NADA.<br />O PARA HACERLO TODO.</div>
      </div>
      <div class="desktop-label">
        EST. 2026 &nbsp; / &nbsp; EDICIÓN 001<span>HECHO DE PÍXELES. LLENO DE IDEAS.</span>
      </div>
      <main id="windows"></main>
      <div id="start" hidden>
        <div class="menu-head">PAPEL OS <small>Tu pequeño universo digital.</small></div>
        <div id="startapps"></div>
        <button id="reboot">↻ Reiniciar escritorio</button>
      </div>
      <footer>
        <button id="startbutton">▧ Inicio</button>
        <div id="tasks"></div>
        <button id="showdesktop" title="Mostrar escritorio">▱</button
        ><span class="footer-right">LOCAL / WEB <span id="clock"></span></span>
      </footer>
      <div id="toast" role="status"></div>
    </div>
    <script src="js/core/runtime.js"></script>
    <script src="js/apps/utilities.js"></script>
    <script src="js/ui/icons.js"></script>
    <script src="js/apps/files-and-clock.js"></script>
    <script src="js/apps/documents-budget-snake.js"></script>
    <script src="js/desktop/notes-and-backup.js"></script>
    <script src="js/ui/motion.js"></script>
    <script src="js/ui/welcome-and-start.js"></script>
    <script src="js/desktop/icon-layout.js"></script>
    <script src="js/desktop/workspace.js"></script>
    <script src="js/apps/terminal-commands.js"></script>
    <script src="js/apps/editor-tools.js"></script>
    <script src="js/apps/terminal.js"></script>
    <script src="js/desktop/icon-grid.js"></script>
    <script src="js/desktop/personalization.js"></script>
    <script src="js/desktop/system-tray.js"></script>
    <script src="js/desktop/window-manager.js"></script>
    <script src="js/ui/start-menu.js"></script>
    <script src="js/ui/explorer.js"></script>
    <script src="js/desktop/interface-sounds.js"></script>
    <script src="js/apps/music-player.js"></script>
    <script src="js/apps/reminders.js"></script>
  </body>
</html>
